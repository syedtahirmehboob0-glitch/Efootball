name: Unity Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Unity Personal license serial
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          SERIAL="$(printf '%s' "$UNITY_LICENSE" | sed -n 's/.*DeveloperData.*Value="\([^"]*\)".*/\1/p' | head -n 1 | base64 --decode 2>/dev/null || true)"
          if [ -z "$SERIAL" ]; then
            echo "Could not extract Unity Personal serial from UNITY_LICENSE."
            exit 1
          fi
          echo "UNITY_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.2f1
          targetPlatform: Android
          buildMethod: AndroidBuild.Build
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel35
          customImage: unityci/editor:ubuntu-6000.3.2f1-android-3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Efootball-Android-APK
          path: Builds/PakistanStreetFootball.apk
          if-no-files-found: error
