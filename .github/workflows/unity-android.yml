name: Unity Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL" || { echo "::error::UNITY_EMAIL is empty"; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::UNITY_PASSWORD is empty"; exit 1; }
          test -n "$UNITY_LICENSE" || { echo "::error::UNITY_LICENSE is empty"; exit 1; }
          printf '%s' "$UNITY_LICENSE" | grep -q '<root' || { echo "::error::UNITY_LICENSE does not look like a Unity ULF XML file"; exit 1; }
          printf '%s' "$UNITY_LICENSE" | grep -q '<License ' || { echo "::error::UNITY_LICENSE is missing the Unity License element"; exit 1; }
          printf '%s' "$UNITY_LICENSE" | grep -q '<Signature' || { echo "::error::UNITY_LICENSE is missing the XML signature"; exit 1; }
          echo "Unity CI license secret structure check passed."

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.2f1
          targetPlatform: Android
          buildMethod: AndroidBuild.Build
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel35
          customImage: unityci/editor:ubuntu-6000.3.2f1-android-3
          customParameters: -logFile /tmp/unity-build.log

      - name: Fix APK workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/PakistanStreetFootball.apk
          sudo chown -R "$(id -u):$(id -g)" Builds
          chmod u+rw Builds/PakistanStreetFootball.apk
          ls -l Builds/PakistanStreetFootball.apk

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="Builds/PakistanStreetFootball.apk"
          test -s "$APK"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$ZIPALIGN" || { echo "::error::zipalign not found: $ZIPALIGN"; exit 1; }
          command -v keytool
          command -v jarsigner

          KEYSTORE="${RUNNER_TEMP}/android-debug.jks"
          ALIGNED="${RUNNER_TEMP}/PakistanStreetFootball-aligned.apk"
          SIGNED="${RUNNER_TEMP}/PakistanStreetFootball-signed.apk"
          rm -f "$KEYSTORE" "$ALIGNED" "$SIGNED"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          test -s "$ALIGNED"

          jarsigner \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "$SIGNED" \
            "$ALIGNED" \
            androiddebugkey

          test -s "$SIGNED"
          jarsigner -verify -verbose -certs "$SIGNED" > "${RUNNER_TEMP}/jarsigner-verify.txt" 2>&1
          cat "${RUNNER_TEMP}/jarsigner-verify.txt"
          grep -qi "jar verified" "${RUNNER_TEMP}/jarsigner-verify.txt" || { echo "::error::jarsigner verification did not report a verified APK"; exit 1; }

          cp "$SIGNED" "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          file "$APK"
          echo "SIGNED APK READY: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Efootball-Android-APK
          path: Builds/PakistanStreetFootball.apk
          if-no-files-found: error
