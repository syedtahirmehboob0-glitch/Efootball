name: Unity Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL" || { echo "::error::UNITY_EMAIL is empty"; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::UNITY_PASSWORD is empty"; exit 1; }
          test -n "$UNITY_LICENSE" || { echo "::error::UNITY_LICENSE is empty"; exit 1; }
          printf '%s' "$UNITY_LICENSE" | grep -q '<root' || { echo "::error::UNITY_LICENSE does not look like a Unity ULF XML file"; exit 1; }
          printf '%s' "$UNITY_LICENSE" | grep -q '<License ' || { echo "::error::UNITY_LICENSE is missing the Unity License element"; exit 1; }
          printf '%s' "$UNITY_LICENSE" | grep -q '<Signature' || { echo "::error::UNITY_LICENSE is missing the XML signature"; exit 1; }
          echo "Unity CI license secret structure check passed."

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.2f1
          targetPlatform: Android
          buildMethod: AndroidBuild.Build
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel35
          customImage: unityci/editor:ubuntu-6000.3.2f1-android-3
          customParameters: -logFile /tmp/unity-build.log

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="Builds/PakistanStreetFootball.apk"
          test -s "$APK"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          KEYSTORE="${RUNNER_TEMP}/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ALIGNED="${APK%.apk}-aligned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$APK" \
            "$ALIGNED"
          rm -f "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          file "$APK"
          echo "SIGNED APK READY: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Efootball-Android-APK
          path: Builds/PakistanStreetFootball.apk
          if-no-files-found: error

# Force CI rebuild to inspect the current Unity Android build.
